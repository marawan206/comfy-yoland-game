<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Comfy Org: The Move</title>
<meta name="description" content="An 8-bit story of Comfy Org moving from the Victorian house to 201 Spear Street. Starring Yoland.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --bg: #ece8e0; --ink: #1c1a24; --panel: #14121c; --accent: #ffd23f; --comfy: #7c5cff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; touch-action: none; }
  body { font-family: 'Press Start 2P', 'Courier New', monospace; color: var(--ink); }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
  #hud { position: fixed; top: 12px; left: 12px; font-size: 10px; line-height: 1.8; color: #fff;
         background: rgba(20,18,28,.85); padding: 10px 12px; border: 3px solid #fff; box-shadow: 4px 4px 0 #000;
         pointer-events: none; max-width: 60vw; }
  #hud .obj { color: var(--accent); }
  #hint { position: fixed; top: 12px; right: 12px; font-size: 9px; color: #fff; background: rgba(20,18,28,.85);
          padding: 8px 10px; border: 3px solid #fff; box-shadow: 4px 4px 0 #000; text-align: right; line-height: 1.8; }
  #hint b { color: var(--accent); }
  #dlg { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); width: min(820px, calc(100vw - 32px));
         background: var(--panel); color: #fff; border: 4px solid #fff; box-shadow: 6px 6px 0 #000;
         padding: 18px 22px 22px; font-size: 13px; line-height: 1.9; display: none; cursor: pointer; }
  #dlg .name { color: var(--accent); font-size: 11px; margin-bottom: 8px; letter-spacing: 1px; }
  #dlg .name.deep { color: #7cf5ff; } #dlg .name.narr { color: #b8b3c9; } #dlg .name.team { color: #9dff7c; }
  #dlg .text { min-height: 3.8em; white-space: pre-wrap; }
  #dlg .more { position: absolute; right: 16px; bottom: 8px; font-size: 12px; animation: bob .6s infinite alternate; }
  @keyframes bob { from { transform: translateY(0) } to { transform: translateY(4px) } }
  #overlay { position: fixed; inset: 0; background: #0d0b14; color: #fff; display: flex; flex-direction: column;
             align-items: center; justify-content: center; text-align: center; padding: 24px; gap: 22px; }
  #overlay h1 { font-size: clamp(16px, 4vw, 34px); color: var(--accent); text-shadow: 4px 4px 0 #5a3d00; margin: 0; line-height: 1.5; }
  #overlay p { font-size: clamp(9px, 1.6vw, 13px); line-height: 2; max-width: 720px; margin: 0; color: #d8d4e6; }
  #overlay img { width: min(420px, 70vw); image-rendering: pixelated; border: 4px solid #fff; box-shadow: 8px 8px 0 #000; }
  #overlay .press { font-size: clamp(9px, 1.5vw, 12px); color: #fff; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0 } }
  #overlay.hidden, #hud.hidden, #hint.hidden { display: none; }
  #pad { position: fixed; left: 16px; bottom: 16px; display: none; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 4px; }
  #pad button, #act { background: rgba(20,18,28,.8); color: #fff; border: 3px solid #fff; font-family: inherit; font-size: 16px; box-shadow: 3px 3px 0 #000; }
  #pad button:active, #act:active { transform: translate(2px,2px); box-shadow: none; }
  #act { position: fixed; right: 20px; bottom: 36px; width: 84px; height: 84px; border-radius: 50%; display: none; font-size: 13px; }
  .touch #pad { display: grid; } .touch #act { display: block; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .5s; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hidden"><div id="lvl"></div><div class="obj" id="obj"></div></div>
<div id="hint" class="hidden"><b>WASD / Arrows</b> move<br><b>E / Space</b> talk<br><b>M</b> mute</div>
<div id="dlg"><div class="name" id="dname"></div><div class="text" id="dtext"></div><div class="more">&#9660;</div></div>
<div id="pad">
  <span></span><button data-k="ArrowUp">&#9650;</button><span></span>
  <button data-k="ArrowLeft">&#9664;</button><span></span><button data-k="ArrowRight">&#9654;</button>
  <span></span><button data-k="ArrowDown">&#9660;</button><span></span>
</div>
<button id="act">TALK</button>
<div id="fade"></div>
<div id="overlay">
  <h1>COMFY ORG<br>THE MOVE</h1>
  <img id="titleimg" src="levels/title.png" alt="The lavender Victorian house where Comfy started">
  <p>The story of how Comfy left the lavender Victorian house<br>for 201 Spear Street, Suite 1700, San Francisco.<br><br>Starring Yoland. Featuring Deep, Jedrzej and Purz,<br>who cannot be locked out anymore.</p>
  <div class="press" id="press">PRESS ENTER / TAP TO START</div>
</div>
<script src="game.js"></script>
</body>
</html>
